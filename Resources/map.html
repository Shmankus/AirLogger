<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html,
    body,
    #map {
      height: 100%;
      margin: 0;
      background: #1c1c1e;
    }

    /* Invert the OSM tiles into a dark basemap; markers live in a separate pane. */
    .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.9);
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #2c2c2e;
      color: #fff;
    }

    .leaflet-popup-content {
      font: 13px -apple-system, sans-serif;
    }

    .leaflet-container a {
      color: #0a84ff;
    }

    /* Cluster bubble: a type-coloured disc with the member count. */
    .cluster {
      background: transparent;
      border: 0;
    }

    .cluster div {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      color: #fff;
      font: 700 13px -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.9;
    }

    .nav-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .nav-btn {
      flex: 1;
      padding: 6px 0;
      border: 0;
      border-radius: 8px;
      background: #3a3a3c;
      color: #fff;
      font: 600 13px -apple-system, sans-serif;
    }

    .nav-btn:disabled {
      opacity: 0.35;
    }

    .detail-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 6px 0;
      border: 0;
      border-radius: 8px;
      background: #0a84ff;
      color: #fff;
      font: 600 13px -apple-system, sans-serif;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <script>
    try {
      // Canvas renderer: every device dot is drawn on one canvas instead of being
      // its own SVG node.
      var map = L.map('map', { zoomControl: false, preferCanvas: true });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        { maxZoom: 19, attribution: '(c) OpenStreetMap' }).addTo(map);

      // The user's dot gets its own SVG pane above the device canvas, so it stays
      // on top without bringToFront() (which throws on canvas-rendered markers).
      map.createPane('user').style.zIndex = 650;
      var userMarker = L.circleMarker(
        [__LAT__, __LON__],
        {
          pane: 'user', renderer: L.svg({ pane: 'user' }),
          radius: 6, color: '#ff6464', weight: 2, fillColor: '#ad0149', fillOpacity: 1
        }
      ).addTo(map).bindPopup('You');

      // Below NO_CLUSTER_ZOOM, pins within CLUSTER_PX of each other on screen merge
      // into one counted bubble; at NO_CLUSTER_ZOOM and above every pin is its own dot.
      var CLUSTER_PX = 50, NO_CLUSTER_ZOOM = 18;
      // Only pins/clusters inside the viewport (plus this margin, as a fraction of its
      // size) get a marker at all; the rest exist only as data until panned into view.
      var VIEW_PAD = 0.25;
      var levels = [];       // levels[z] = clusters/leaves shown at zoom z (see buildClusters)

      var dotLayer = L.layerGroup().addTo(map);
      var clusterLayer = L.layerGroup().addTo(map);
      var entries = {};      // id -> { p, cur:[lat,lon], target:[lat,lon], m: dot or null }
      var didFit = false;
      map.setView([__LAT__, __LON__], 16);

    function distm(a, b) {
      var dy = (a[0] - b[0]) * 111320;
      var dx = (a[1] - b[1]) * 111320 * Math.cos(a[0] * Math.PI / 180);
      return Math.sqrt(dx * dx + dy * dy);
    }

    function timeConverter(UNIX_timestamp) {
      var a = new Date(UNIX_timestamp * 1000);
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var year = a.getFullYear();
      var month = months[a.getMonth()];
      var date = a.getDate();
      var hour = a.getHours();
      var min = a.getMinutes();
      var sec = a.getSeconds();
      var time = date + ' ' + month + ' ' + year + ' ' + hour + ':' + min + ':' + sec;
      return time;
    }


    // Dots within this many metres of each other count as stacked (drawn on top of
    // one another, even at max zoom).
    var STACK_M = 3;

    // Prev/Next walk: every pin ordered by distance from the dot the walk started on
    // (order[0]). Kept fixed while walking so Prev exactly retraces Next; reset when
    // a popup is opened any other way.
    var nav = null;          // { order: [ids], dist: [m], idx }
    var currentId = null;    // pin whose popup is open
    var navigating = false;  // a popup is being opened by goTo, not a tap

    function stackedCount(e) {
      var n = 0;
      for (var id in entries) if (distm(e.target, entries[id].target) < STACK_M) n++;
      return n;
    }

    // Popup HTML for a device pin. Only built while its popup is open (it scans
    // every pin for the stacked count).
    function ph(e) {
      var p = e.p, extra = '';
      var stacked = stackedCount(e);
      if (stacked > 1) extra += '<br><span style="color:#ffd60a">' + stacked + ' dots stacked here</span>';
      var walking = nav && nav.order[nav.idx] === p.id;
      if (walking && nav.idx > 0)
        extra += '<br><span style="opacity:0.7">#' + (nav.idx + 1) + ' nearest &middot; ' +
          Math.round(nav.dist[nav.idx]) + ' m from start</span>';
      var atStart = !walking || nav.idx === 0;
      var atEnd = walking ? nav.idx >= nav.order.length - 1 : Object.keys(entries).length < 2;
      return '<b>' + p.name + '</b><br>' +
        '<span style="font-family:monospace;opacity:0.7">' + 'Last Seen: ' + (timeConverter(p.ts)).toString() + '</span><br>' +
        '<span style="font-family:monospace;opacity:0.7">' + p.id + '</span><br>' +
        p.type + ' &middot; ' + p.rssi + ' dBm<br>' +
        p.n + ' obs &middot; ~' + Math.round(p.radius) + ' m &middot; ' + p.method + extra +
        '<div class="nav-row">' +
        '<button class="nav-btn" onclick="navPin(-1)"' + (atStart ? ' disabled' : '') + '>&lsaquo; Prev</button>' +
        '<button class="nav-btn" onclick="navPin(1)"' + (atEnd ? ' disabled' : '') + '>Next &rsaquo;</button>' +
        '</div>' +
        '<button class="detail-btn" onclick="openDetail(\'' + p.id + '\')">View Details</button>';
    }

    // Popup Prev/Next: step to the next/previous closest pin to where the walk began.
    function navPin(step) {
      if (!currentId || !entries[currentId]) return;
      if (!nav || nav.order[nav.idx] !== currentId) {
        var from = entries[currentId].target, list = [];
        for (var id in entries) list.push({ id: id, d: distm(from, entries[id].target) });
        list.sort(function (a, b) { return a.d - b.d || (a.id === currentId ? -1 : b.id === currentId ? 1 : 0); });
        nav = { order: list.map(function (x) { return x.id; }), dist: list.map(function (x) { return x.d; }), idx: 0 };
      }
      var idx = Math.max(0, Math.min(nav.order.length - 1, nav.idx + step));
      if (idx === nav.idx) return;
      nav.idx = idx;
      goTo(nav.order[idx]);
    }

    // Center on a pin (zoomed in past clustering) and open its popup.
    function goTo(id) {
      var e = entries[id];
      if (!e) return;
      e.cur = e.target.slice();
      navigating = true;
      map.setView(e.cur, Math.max(map.getZoom(), NO_CLUSTER_ZOOM), { animate: false });
      render();
      showDot(e);
      e.m.setLatLng(e.cur);
      e.m.openPopup();
      navigating = false;
    }

    // Popup button: native switches to the All tab and opens this device's detail page.
    function openDetail(id) {
      try { window.webkit.messageHandlers.detail.postMessage(id); } catch (x) { }
    }

    // The entry's dot, created on first need (pins never on screen never get one).
    function dotFor(e) {
      if (!e.m) {
        e.m = L.circleMarker(e.cur,
          { radius: 6, color: '#fff', weight: 1.5, fillColor: e.p.color, fillOpacity: 0.95 });
        // Content is filled in when it opens (and refreshed while open).
        e.m.bindPopup('');
        var id = e.p.id;
        e.m.on('popupopen', function () {
          currentId = id;
          if (!navigating) nav = null;   // tapped directly: a new walk starts here
          if (entries[id]) entries[id].m.setPopupContent(ph(entries[id]));
        });
      }
      return e.m;
    }

    function showDot(e) {
      var m = dotFor(e);
      if (dotLayer.hasLayer(m)) return;
      m.setLatLng(e.cur);        // may have moved while hidden
      dotLayer.addLayer(m);
    }

    // Hierarchical clustering (the supercluster approach), over ALL pins so counts
    // don't depend on what's on screen. levels[NO_CLUSTER_ZOOM] is the individual
    // pins; each lower level greedily merges the level above it, absorbing items
    // within CLUSTER_PX (at that zoom) of a seed. So a bubble is always exactly the
    // union of what it splits into one zoom level up. Positions are zoom-0 world
    // pixels, where a distance of 1 is 2^z screen pixels at zoom z.
    function buildClusters() {
      var leaves = [];
      for (var id in entries) {
        var e = entries[id], pt = map.project(e.target, 0), cc = {};
        cc[e.p.color] = 1;
        leaves.push({ x: pt.x, y: pt.y, n: 1, id: id, colors: cc,
                      bounds: L.latLngBounds([e.target, e.target]) });
      }
      levels = [];
      levels[NO_CLUSTER_ZOOM] = leaves;
      for (var z = NO_CLUSTER_ZOOM - 1; z >= 0; z--) levels[z] = mergeLevel(levels[z + 1], CLUSTER_PX / Math.pow(2, z));
    }

    function mergeLevel(items, r) {
      // Grid index with cell size r: any neighbour within r is in the 3x3 block.
      var grid = {}, out = [], r2 = r * r;
      items.forEach(function (it, i) {
        var k = Math.floor(it.x / r) + ':' + Math.floor(it.y / r);
        (grid[k] = grid[k] || []).push(i);
      });
      var used = new Array(items.length);
      for (var i = 0; i < items.length; i++) {
        if (used[i]) continue;
        used[i] = true;
        var seed = items[i], gx = Math.floor(seed.x / r), gy = Math.floor(seed.y / r), group = [seed];
        for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++) {
          var cell = grid[(gx + dx) + ':' + (gy + dy)];
          if (!cell) continue;
          for (var c = 0; c < cell.length; c++) {
            var j = cell[c];
            if (used[j]) continue;
            var o = items[j], ddx = o.x - seed.x, ddy = o.y - seed.y;
            if (ddx * ddx + ddy * ddy <= r2) { used[j] = true; group.push(o); }
          }
        }
        if (group.length === 1) { out.push(seed); continue; }  // carried up unchanged
        var n = 0, x = 0, y = 0, colors = {}, b = L.latLngBounds(seed.bounds.getSouthWest(), seed.bounds.getNorthEast());
        group.forEach(function (g) {
          n += g.n; x += g.x * g.n; y += g.y * g.n;
          for (var col in g.colors) colors[col] = (colors[col] || 0) + g.colors[col];
          b.extend(g.bounds);
        });
        out.push({ x: x / n, y: y / n, n: n, colors: colors, bounds: b });
      }
      return out;
    }

    // A counted bubble; tapping it zooms to fit its members so they separate.
    function clusterMarker(cl) {
      var color = null, best = 0;
      for (var col in cl.colors) if (cl.colors[col] > best) { best = cl.colors[col]; color = col; }
      var size = Math.min(60, Math.round(22 + 8 * Math.log(cl.n) / Math.LN2));
      var m = L.marker(map.unproject([cl.x, cl.y], 0), {
        keyboard: false,
        icon: L.divIcon({
          className: 'cluster', iconSize: [size, size],
          html: '<div style="background:' + color + '">' + cl.n + '</div>'
        })
      });
      m.on('click', function () {
        var b = cl.bounds;
        if (b.getNorthEast().equals(b.getSouthWest())) map.setView(b.getCenter(), NO_CLUSTER_ZOOM);
        else map.fitBounds(b, { padding: [50, 50], maxZoom: NO_CLUSTER_ZOOM });
      });
      return m;
    }

    // Draw the current zoom's level, culled to the viewport. Runs on moveend (pan/
    // zoom end) and after each data push, never per frame.
    function render() {
      var bounds = map.getBounds().pad(VIEW_PAD);
      var z = Math.max(0, Math.min(NO_CLUSTER_ZOOM, Math.floor(map.getZoom())));
      var items = levels[z] || [], show = {};
      clusterLayer.clearLayers();
      items.forEach(function (it) {
        if (it.n === 1) {
          if (bounds.contains(entries[it.id].target)) show[it.id] = 1;
        } else if (bounds.intersects(it.bounds)) {
          clusterLayer.addLayer(clusterMarker(it));
        }
      });
      for (var id in entries) {
        var e = entries[id];
        if (show[id]) showDot(e);
        else if (e.m && dotLayer.hasLayer(e.m)) dotLayer.removeLayer(e.m);
      }
    }
    map.on('moveend', render);

    // Called from native (after updateData) to center on a pin and open its popup.
    window.focusPin = function (id) {
      nav = null;
      goTo(id);
    };

    // Called from native every few seconds with { u:[lat,lon], pins:[...] }.
    window.updateData = function (d) {
      try {
        userMarker.setLatLng(d.u);
        var seen = {}, pts = [], moved = false, changed = false;

        d.pins.forEach(function (p) {
          seen[p.id] = 1;
          var e = entries[p.id];
          if (e) {
            // Existing device: retarget (tick() eases it there) and refresh popup.
            if (e.target[0] !== p.lat || e.target[1] !== p.lon) { e.target = [p.lat, p.lon]; moved = true; }
            e.p = p;
            if (e.m && e.m.isPopupOpen()) e.m.setPopupContent(ph(e));
          } else {
            entries[p.id] = { p: p, cur: [p.lat, p.lon], target: [p.lat, p.lon], m: null };
            changed = true;
          }
          if (distm([p.lat, p.lon], d.u) < 2000) pts.push([p.lat, p.lon]);
        });

        // Drop devices no longer present (e.g. after a wipe or a filter change).
        for (var id in entries) {
          if (seen[id]) continue;
          if (entries[id].m) dotLayer.removeLayer(entries[id].m);
          delete entries[id];
          changed = true;
        }

        // Rebuilding every level is the expensive part; skip it when the pins are
        // the same as last push (most refreshes while standing still).
        if (changed || moved) buildClusters();

        // Fit once; afterward leave the user's pan/zoom alone (refresh re-fits).
        if (!didFit) {
          pts.push(d.u);
          didFit = true;
          if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 18 });
          else map.setView(d.u, 16);
        }
        render();
        if (moved) startEasing();
      } catch (e) {
        try { window.webkit.messageHandlers.err.postMessage('upd: ' + e.message); } catch (x) { }
      }
    };

    // Smoothly ease visible dots toward their targets. The frame loop only runs
    // while something is still moving, then stops (no idle 60fps redraws).
    var easing = false;
    function startEasing() {
      if (!easing) { easing = true; requestAnimationFrame(tick); }
    }
    function tick() {
      var moving = false;
      for (var id in entries) {
        var e = entries[id], c = e.cur, t = e.target;
        if (c[0] === t[0] && c[1] === t[1]) continue;
        if (!e.m || !dotLayer.hasLayer(e.m)) { e.cur = t.slice(); continue; } // hidden: just jump
        c[0] += (t[0] - c[0]) * 0.18;
        c[1] += (t[1] - c[1]) * 0.18;
        if (Math.abs(t[0] - c[0]) < 1e-7) c[0] = t[0];
        if (Math.abs(t[1] - c[1]) < 1e-7) c[1] = t[1];
        e.m.setLatLng(c);
        var pu = e.m.getPopup();
        if (pu && pu.isOpen()) pu.setLatLng(c);   // keep an open popup on the dot
        moving = true;
      }
      if (moving) requestAnimationFrame(tick);
      else easing = false;
    }

} catch (e) {
      try { window.webkit.messageHandlers.err.postMessage('init: ' + e.message); } catch (x) { }
    }
  </script>
</body>

</html>
